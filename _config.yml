title: 최 회계사의 세금과 경영
description: 세금 이슈와 경영에 필요한 숫자를 실무 관점에서 정리하는 공간
author: 최 회계사

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  skin: classic
  date_format: "%Y-%m-%d"

permalink: /:year/:month/:day/:title/

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
